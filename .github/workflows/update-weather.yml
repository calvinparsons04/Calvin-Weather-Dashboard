name: Update Weather Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Get repo files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install requests pandas

      - name: Run weather logger once
        run: python weather_logger_once.py

      - name: Commit updated weather data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add weather_data_big.csv
          git commit -m "Update weather data" || echo "No changes"
          git push
